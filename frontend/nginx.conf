server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: cualquier ruta que no sea un archivo real la resuelve
    # Angular Router (ya no usamos HashLocationStrategy, así que hace falta
    # este rewrite para rutas como /proyectos servidas directo por nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets con hash en el nombre (generado por el build de Angular).
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
