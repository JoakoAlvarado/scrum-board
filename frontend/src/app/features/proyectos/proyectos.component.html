<div class="card">
    <div class="flex align-items-center justify-content-between mb-4">
        <h5 class="m-0">Proyectos</h5>
        <button pButton pRipple label="Nuevo proyecto" icon="pi pi-plus" [disabled]="true"
                pTooltip="Disponible cuando el CRUD de proyectos esté conectado a la Api"
                tooltipPosition="left"></button>
    </div>

    <div class="flex flex-column align-items-center justify-content-center py-8 text-600">
        <i class="pi pi-folder-open text-4xl mb-3"></i>
        <p class="m-0">Todavía no hay proyectos cargados.</p>
        <p class="m-0 text-sm">El listado, alta, edición y eliminación se conectan a la Api en el próximo paso del plan.</p>
    </div>
</div>
