<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <div class="text-900 text-3xl font-medium mb-3">ScrumBoard</div>
                    <span class="text-600 font-medium">Ingresá con tu cuenta para continuar</span>
                </div>

                <form [formGroup]="form" (ngSubmit)="ingresar()">
                    <label for="email" class="block text-900 text-xl font-medium mb-2">Email</label>
                    <input id="email" type="text" formControlName="email" placeholder="Email"
                           pInputText class="w-full md:w-30rem mb-2" style="padding:1rem">
                    <small class="p-error block mb-3" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
                        Ingresá un email válido.
                    </small>

                    <label for="password" class="block text-900 font-medium text-xl mb-2">Contraseña</label>
                    <p-password id="password" formControlName="password" placeholder="Contraseña"
                                [toggleMask]="true" [feedback]="false" styleClass="mb-2 w-full"
                                inputStyleClass="w-full p-3 md:w-30rem"></p-password>
                    <small class="p-error block mb-3" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
                        La contraseña es obligatoria.
                    </small>

                    <small class="p-error block mb-3" *ngIf="errorMensaje">{{ errorMensaje }}</small>

                    <button pButton pRipple type="submit" label="Ingresar" [loading]="cargando"
                            class="w-full p-3 text-xl mt-2"></button>
                </form>
            </div>
        </div>
    </div>
</div>
